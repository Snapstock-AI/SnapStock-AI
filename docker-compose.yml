services:
  postgres:
    container_name: snapstock-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: snapstock-pgadmin
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  localstack:
    container_name: snapstock-localstack
    image: localstack/localstack:3.8.1
    restart: unless-stopped
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      S3_UPLOAD_BUCKET: ${S3_UPLOAD_BUCKET:-snapstock-uploads}
      ANALYSIS_REQUEST_QUEUE_NAME: ${ANALYSIS_REQUEST_QUEUE_NAME:-snapstock-analysis-jobs}
      ANALYSIS_RESULT_QUEUE_NAME: ${ANALYSIS_RESULT_QUEUE_NAME:-snapstock-analysis-results}
      DEBUG: ${LOCALSTACK_DEBUG:-0}
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./infra/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh

volumes:
  postgres-data:
  pgadmin-data:
  localstack-data:
