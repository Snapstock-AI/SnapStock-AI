apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapstock-frontend
  labels:
    app: snapstock-frontend
spec:
  selector:
    matchLabels:
      app: snapstock-frontend
  template:
    metadata:
      labels:
        app: snapstock-frontend
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: snapstock-frontend
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ required "frontend.image.tag is required" .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.port }}
            # Plain-HTTP listener that only redirects to https (used when TLS is enabled).
            - containerPort: {{ .Values.frontend.redirectPort }}
          env:
            # nginx template proxies /snapstock-backend-http/ to this upstream
            - name: BACKEND_UPSTREAM
              value: "snapstock-backend:{{ .Values.backend.port }}"
            # Host the http->https redirect sends browsers to (empty = keep the requested host)
            - name: PUBLIC_HOST
              value: {{ .Values.publicService.host | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.frontend.port }}
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.frontend.port }}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: snapstock-frontend
spec:
  selector:
    app: snapstock-frontend
  ports:
    - port: 80
      targetPort: {{ .Values.frontend.port }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: snapstock-frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: snapstock-frontend
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: snapstock-frontend
spec:
  scaleTargetRef:
    name: snapstock-frontend
  minReplicaCount: {{ .Values.frontend.scaling.minReplicas }}
  maxReplicaCount: {{ .Values.frontend.scaling.maxReplicas }}
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "{{ .Values.frontend.scaling.cpuUtilization }}"
