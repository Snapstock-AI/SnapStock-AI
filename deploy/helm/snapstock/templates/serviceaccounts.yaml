# Per-workload identities. With IRSA the role ARN annotation gives the pod AWS credentials
# for exactly the S3/SQS actions it needs (see infra/eks/terraform/events.tf).
{{- range $name, $sa := .Values.serviceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: snapstock-{{ $name }}
  {{- if $sa.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ $sa.roleArn | quote }}
  {{- end }}
{{- end }}
