name: Configure Public Access

# Opens EC2 security-group ports and prepares the host for
# https://snapstock.rashmika.dev/ via SSM (same role as frontend deploy).

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Public hostname"
        required: true
        default: "snapstock.rashmika.dev"
      public_ip:
        description: "EC2 public IPv4"
        required: true
        default: "15.252.170.236"

permissions:
  contents: read
  id-token: write

jobs:
  open-ports-and-configure:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Open security group ports 22/80/443
        env:
          INSTANCE_ID: ${{ vars.SNAPSTOCK_SERVER_INSTANCE_ID }}
        run: |
          set -euo pipefail

          SG_IDS=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].SecurityGroups[].GroupId' \
            --output text)

          echo "Security groups: $SG_IDS"

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "Instance public IP: $PUBLIC_IP"

          for SG in $SG_IDS; do
            for PORT in 22 80 443; do
              echo "Ensuring TCP $PORT on $SG"
              if aws ec2 authorize-security-group-ingress \
                --group-id "$SG" \
                --ip-permissions "IpProtocol=tcp,FromPort=$PORT,ToPort=$PORT,IpRanges=[{CidrIp=0.0.0.0/0,Description=SnapStock public $PORT}]"; then
                echo "  added $PORT"
              else
                echo "  $PORT already present (or denied)"
              fi
            done
          done

      - name: Configure host firewall + inspect cluster via SSM
        env:
          INSTANCE_ID: ${{ vars.SNAPSTOCK_SERVER_INSTANCE_ID }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          set -euo pipefail

          # shellcheck disable=SC2016
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Open local firewall + inspect OpenChoreo for $DOMAIN" \
            --timeout-seconds 300 \
            --parameters commands=["set -euxo pipefail","echo DOMAIN=$DOMAIN","sudo ufw allow 22/tcp || true","sudo ufw allow 80/tcp || true","sudo ufw allow 443/tcp || true","sudo ufw allow 8443/tcp || true","sudo iptables -C INPUT -p tcp --dport 22 -j ACCEPT 2>/dev/null || sudo iptables -I INPUT -p tcp --dport 22 -j ACCEPT","sudo iptables -C INPUT -p tcp --dport 80 -j ACCEPT 2>/dev/null || sudo iptables -I INPUT -p tcp --dport 80 -j ACCEPT","sudo iptables -C INPUT -p tcp --dport 443 -j ACCEPT 2>/dev/null || sudo iptables -I INPUT -p tcp --dport 443 -j ACCEPT","command -v kubectl","kubectl get svc -A | head -80","kubectl get gateway,httproute,certificate,clusterissuer,ingress -A 2>/dev/null | head -100 || true","kubectl get ns | head -40","ls -la /home/ubuntu/*.sh 2>/dev/null || true","curl -s ifconfig.me || true","ss -lntp | head -40 || true","echo DONE"] \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"
