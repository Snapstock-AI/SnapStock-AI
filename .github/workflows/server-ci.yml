name: Server CI

on:
  push:
    branches:
      - dev
      - fix/auth
      - 'fix/**'

  pull_request:
    branches:
      - dev

jobs:
  test:
    name: Server Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check and build
        run: npm run build

      - name: Unit and route tests (with coverage and JUnit)
        run: npm run test:ci
        env:
          JWT_SECRET: test-secret

      - name: Database integration tests (real PostgreSQL)
        run: npm run test:db
        env:
          JWT_SECRET: test-secret
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/snapstock_test

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-reports
          path: server/reports
          if-no-files-found: ignore
