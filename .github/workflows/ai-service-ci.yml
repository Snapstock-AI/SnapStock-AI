name: AI Service CI

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev

jobs:

  test:
    name: AI Service Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-service

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest


  smoke-test:
    name: AI Service Application Test
    runs-on: ubuntu-latest

    needs: test

    defaults:
      run:
        working-directory: ai-service

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start AI service
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for AI service
        run: |
          for i in {1..30}; do
            if curl -f http://127.0.0.1:8000/health; then
              echo "AI service is running"
              exit 0
            fi

            echo "Waiting for AI service..."
            sleep 2
          done

          echo "AI service failed to start"
          cat server.log
          exit 1

      - name: Stop AI service
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi