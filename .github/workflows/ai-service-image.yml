name: Build AI Service Image

# Build and push the AI service image to GHCR.
# OpenChoreo deploy is not wired yet: host deploy-openchoreo.sh only supports
# backend|frontend, and there is no snapstock-ai OpenChoreo workload.

on:
  push:
    branches:
      - dev
    paths:
      - "ai-service/**"
      - ".github/workflows/ai-service-image.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-ai-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AI service image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: true
          tags: |
            ghcr.io/snapstock-ai/snapstock-ai-service:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
