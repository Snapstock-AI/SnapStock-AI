name: AI Service Pipeline

# test -> build (CPU-only PyTorch image) -> smoke test the image -> push -> deploy to EKS
#
# Images: GHCR (always) and ECR (when the EKS stack exists). The EKS cluster pulls from ECR.
# EKS jobs run only when repo variables EKS_CLUSTER_NAME, EKS_DEPLOY_ROLE_ARN and AWS_REGION are set
# (values from `terraform output` in infra/eks/terraform).

on:
  push:
    branches:
      - dev
    paths:
      - "ai-service/**"
      - "deploy/helm/snapstock/**"
      - ".github/workflows/ai-service-image.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ai-service-pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/snapstock-ai/snapstock-ai-service
  ECR_REPOSITORY: snapstock-ai-service
  IMAGE_TAG: dev-${{ github.sha }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU-only PyTorch, same as the image)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build, smoke test and push image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space (image is ~5 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          load: true
          tags: snapstock-ai-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Guards against the exit-139 regression: /analyze must answer and the container must survive it.
      - name: Smoke test /health and /analyze
        run: |
          docker run -d --name ai -p 8000:8000 snapstock-ai-service:ci
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 10
          done
          python3 - <<'PY'
          from PIL import Image
          Image.new("RGB", (320, 240), (200, 30, 30)).save("/tmp/test.jpg")
          PY
          code=$(curl -s -o /tmp/analyze.json -w '%{http_code}' -F "file=@/tmp/test.jpg;type=image/jpeg" http://127.0.0.1:8000/analyze)
          echo "analyze HTTP $code"; head -c 300 /tmp/analyze.json; echo
          sleep 3
          state=$(docker inspect ai --format '{{.State.Status}} {{.State.ExitCode}}')
          echo "container: $state"
          docker logs --tail 30 ai
          case "$code" in 200|400) ;; *) echo "unexpected status"; exit 1 ;; esac
          [ "$state" = "running 0" ] || { echo "AI container died during /analyze"; exit 1; }

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        run: |
          docker tag snapstock-ai-service:ci "$GHCR_IMAGE:$IMAGE_TAG"
          docker push "$GHCR_IMAGE:$IMAGE_TAG"

      - name: Configure AWS credentials
        if: vars.EKS_CLUSTER_NAME != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.EKS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        if: vars.EKS_CLUSTER_NAME != ''
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push to ECR
        if: vars.EKS_CLUSTER_NAME != ''
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker tag snapstock-ai-service:ci "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  deploy-eks:
    name: Deploy to EKS
    needs: build
    if: vars.EKS_CLUSTER_NAME != ''
    runs-on: ubuntu-latest
    # No `environment:` here: it would change the OIDC subject and break the role trust (dev branch only).
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.EKS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Roll out AI image
        run: |
          aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"
          helm upgrade snapstock deploy/helm/snapstock \
            --namespace snapstock \
            --reset-then-reuse-values \
            --set ai.image.tag="$IMAGE_TAG" \
            --wait --timeout 25m
          kubectl -n snapstock rollout status deploy/snapstock-ai --timeout=15m

      - name: Verify AI service from inside the cluster
        run: |
          kubectl -n snapstock get pods -l app=snapstock-ai -o wide
          kubectl -n snapstock run ai-check-${{ github.run_id }} --rm -i --restart=Never \
            --image=curlimages/curl:8.11.1 -- curl -fsS --max-time 20 http://snapstock-ai:8000/health
