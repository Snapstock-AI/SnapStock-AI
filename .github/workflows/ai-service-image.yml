name: Build and Deploy AI Service

on:
  push:
    branches:
      - dev
    paths:
      - "ai-service/**"
      - ".github/workflows/ai-service-image.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write


jobs:

  build-ai-service:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build and push AI service image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: true
          tags: |
            ghcr.io/snapstock-ai/snapstock-ai-service:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max



  deploy-ai-service:

    needs: build-ai-service

    runs-on: ubuntu-latest


    steps:


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}



      - name: Deploy AI service through SSM
        env:
          INSTANCE_ID: ${{ vars.SNAPSTOCK_SERVER_INSTANCE_ID }}
          IMAGE: ghcr.io/snapstock-ai/snapstock-ai-service:dev-${{ github.sha }}

        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy SnapStock AI Service" \
            --timeout-seconds 900 \
            --parameters commands="runuser -u ubuntu -- /home/ubuntu/deploy-openchoreo.sh ai-service $IMAGE" \
            --query "Command.CommandId" \
            --output text)


          echo "Command ID: $COMMAND_ID"


          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true


          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output json


          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query Status \
            --output text)

          [ "$STATUS" = "Success" ]
