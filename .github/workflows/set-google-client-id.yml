name: Set Google Client ID on EKS

# OIDC trust is refs/heads/dev — always dispatch with --ref dev:
#   gh workflow run "Set Google Client ID on EKS" --ref dev -f action=diagnose
#   gh workflow run "Set Google Client ID on EKS" --ref dev -f action=patch

on:
  workflow_dispatch:
    inputs:
      action:
        description: "diagnose = logs/secret check only; patch = set GOOGLE_CLIENT_ID + restart"
        required: true
        type: choice
        options:
          - diagnose
          - patch
        default: diagnose

permissions:
  contents: read
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Require Google client ID variable
        if: inputs.action == 'patch'
        env:
          CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLIENT_ID}" ]; then
            echo "Repository variable VITE_GOOGLE_CLIENT_ID is empty."
            exit 1
          fi
          if [[ "${CLIENT_ID}" != *.apps.googleusercontent.com ]]; then
            echo "VITE_GOOGLE_CLIENT_ID does not look like a Google OAuth client ID."
            exit 1
          fi
          echo "Using client ID ending …${CLIENT_ID: -28}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.EKS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Diagnose cluster and backend logs
        if: inputs.action == 'diagnose'
        env:
          CLUSTER: ${{ vars.EKS_CLUSTER_NAME }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "${CLUSTER}" --region "${REGION}"

          echo "======== NODES ========"
          kubectl get nodes -L workload -o wide || true

          echo "======== SNAPSTOCK WORKLOADS ========"
          kubectl -n snapstock get pods,deploy,svc -o wide || true

          echo "======== SECRET / GOOGLE_CLIENT_ID ========"
          kubectl -n snapstock get secret snapstock-backend-secrets -o json \
            | python3 -c 'import sys,json,base64; d=json.load(sys.stdin).get("data",{});
print("keys:", sorted(d));
cid=d.get("GOOGLE_CLIENT_ID");
print("GOOGLE_CLIENT_ID_len:", len(base64.b64decode(cid)) if cid else 0)'

          POD=$(kubectl -n snapstock get pods -l app=snapstock-backend -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -z "${POD}" ]; then
            POD=$(kubectl -n snapstock get pods -o name | grep -i backend | grep -v migrate | head -1 | cut -d/ -f2 || true)
          fi
          echo "POD=${POD}"
          if [ -n "${POD}" ]; then
            echo "======== BACKEND ENV (filtered) ========"
            kubectl -n snapstock exec "$POD" -- printenv \
              | grep -E '^(GOOGLE_CLIENT_ID|CLIENT_URL|SERVER_PUBLIC_URL|NODE_ENV|CSP_)=' \
              | sed -E 's/(GOOGLE_CLIENT_ID=).+/\1***redacted***/' || true

            echo "======== BACKEND LOGS (tail 300) ========"
            kubectl -n snapstock logs "$POD" --tail=300 || true

            echo "======== BACKEND LOGS grep auth/google/error ========"
            kubectl -n snapstock logs "$POD" --tail=2000 2>/dev/null \
              | grep -iE 'google|auth|/auth|error|fail|warn' | tail -100 || true
          fi

          echo "======== RECENT EVENTS ========"
          kubectl -n snapstock get events --sort-by=.lastTimestamp | tail -40 || true

      - name: Patch secret and restart backend
        if: inputs.action == 'patch'
        env:
          CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          CLUSTER: ${{ vars.EKS_CLUSTER_NAME }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "${CLUSTER}" --region "${REGION}"

          kubectl -n snapstock get secret snapstock-backend-secrets >/dev/null

          kubectl -n snapstock patch secret snapstock-backend-secrets --type merge \
            -p "{\"stringData\":{\"GOOGLE_CLIENT_ID\":\"${CLIENT_ID}\"}}"

          kubectl -n snapstock rollout restart deployment/snapstock-backend
          kubectl -n snapstock rollout status deployment/snapstock-backend --timeout=5m

          LEN=$(kubectl -n snapstock get secret snapstock-backend-secrets \
            -o jsonpath='{.data.GOOGLE_CLIENT_ID}' | base64 -d | wc -c)
          echo "GOOGLE_CLIENT_ID length in secret: ${LEN}"
          test "${LEN}" -gt 20
