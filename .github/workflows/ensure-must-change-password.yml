name: Ensure must_change_password column

# Idempotent production schema fix for users.must_change_password (migration 019).
# Runs via SSM — SSH to the host is not required.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ensure-column:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Apply schema fix via SSM
        env:
          INSTANCE_ID: ${{ vars.SNAPSTOCK_SERVER_INSTANCE_ID }}
        run: |
          set -euo pipefail

          python3 - <<'PY' > /tmp/ssm-params.json
          import json
          script = r'''set -eux
          export KUBECONFIG=/home/ubuntu/.kube/config
          NS=dp-default-snapstock-development-9f3d29f9
          POD=$(kubectl -n "$NS" get pods --field-selector=status.phase=Running -o name | grep backend | head -1 | cut -d/ -f2)
          echo "POD=$POD"
          test -n "$POD"
          cat > /tmp/ensure-mcp.js <<'EOF'
          const { Client } = require("pg");
          (async () => {
            const c = new Client({ connectionString: process.env.DATABASE_URL });
            await c.connect();
            await c.query(`CREATE TABLE IF NOT EXISTS migrations (
              id SERIAL PRIMARY KEY,
              filename VARCHAR(255) UNIQUE NOT NULL,
              executed_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
            )`);
            await c.query(`ALTER TABLE users ADD COLUMN IF NOT EXISTS must_change_password BOOLEAN NOT NULL DEFAULT FALSE`);
            await c.query(
              `INSERT INTO migrations (filename) SELECT $1 WHERE NOT EXISTS (SELECT 1 FROM migrations WHERE filename = $1)`,
              ["019_add_temporary_password_flag.ts"]
            );
            const r = await c.query(
              `SELECT column_name FROM information_schema.columns WHERE table_name = $1 AND column_name = $2`,
              ["users", "must_change_password"]
            );
            console.log(r.rows.length ? "column-ok" : "column-missing");
            await c.end();
          })().catch((e) => { console.error(e); process.exit(1); });
          EOF
          kubectl -n "$NS" cp /tmp/ensure-mcp.js "$POD":/tmp/ensure-mcp.js
          kubectl -n "$NS" exec "$POD" -- node /tmp/ensure-mcp.js
          '''
          print(json.dumps({"commands": [f"bash -lc {json.dumps(script)}"]}))
          PY

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Ensure users.must_change_password exists" \
            --timeout-seconds 300 \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output json

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          test "$STATUS" = "Success"
