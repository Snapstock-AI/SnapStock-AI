name: Build and Deploy Frontend

on:
  push:
    branches:
      - dev
    paths:
      - "client/**"
      - ".github/workflows/frontend-image.yml"

  workflow_dispatch:


permissions:
  contents: read
  packages: write
  id-token: write


jobs:

  build-frontend:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/snapstock-backend-http
          tags: |
            ghcr.io/snapstock-ai/snapstock-client:dev-${{ github.sha }}



  deploy-frontend:

    needs: build-frontend

    runs-on: ubuntu-latest


    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}


      - name: Deploy frontend through SSM
        env:
          INSTANCE_ID: ${{ vars.SNAPSTOCK_SERVER_INSTANCE_ID }}
          IMAGE: ghcr.io/snapstock-ai/snapstock-client:dev-${{ github.sha }}

        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy SnapStock Frontend" \
            --parameters commands="runuser -u ubuntu -- /home/ubuntu/deploy-openchoreo.sh frontend $IMAGE" \
            --query "Command.CommandId" \
            --output text)


          echo "Command ID: $COMMAND_ID"


          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"


          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"