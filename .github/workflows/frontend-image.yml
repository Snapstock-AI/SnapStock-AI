name: Build and Deploy Frontend

on:
  push:
    branches:
      - dev
    paths:
      - "client/**"
      - ".github/workflows/frontend-image.yml"

  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        required: true
        type: choice
        options:
          - deploy
          - open-ports
        default: deploy
      domain:
        description: "Public hostname (open-ports only)"
        required: false
        default: "snapstock.rashmika.dev"


permissions:
  contents: read
  packages: write
  id-token: write


jobs:

  open-ports:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'open-ports'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Deploy role has SSM only (no EC2 SG mutate). Open host firewall + probe cluster.
      - name: Host firewall + cluster inspect via SSM
        env:
          INSTANCE_ID: ${{ vars.SNAPSTOCK_SERVER_INSTANCE_ID }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          set -euo pipefail

          # Use JSON --parameters to avoid AWS CLI shorthand quoting bugs
          PARAMS=$(jq -nc --arg d "$DOMAIN" '{
            commands: [
              "sudo ufw allow 22/tcp || true",
              "sudo ufw allow 80/tcp || true",
              "sudo ufw allow 443/tcp || true",
              "sudo ufw allow 8443/tcp || true",
              "sudo iptables -C INPUT -p tcp --dport 22 -j ACCEPT || sudo iptables -I INPUT -p tcp --dport 22 -j ACCEPT",
              "sudo iptables -C INPUT -p tcp --dport 80 -j ACCEPT || sudo iptables -I INPUT -p tcp --dport 80 -j ACCEPT",
              "sudo iptables -C INPUT -p tcp --dport 443 -j ACCEPT || sudo iptables -I INPUT -p tcp --dport 443 -j ACCEPT",
              ("echo DOMAIN=" + $d),
              "command -v kubectl",
              "kubectl get svc -A",
              "kubectl get gateway,httproute,certificate,clusterissuer,ingress -A || true",
              "kubectl get httproute -A -o wide || true",
              "kubectl get gateway -A -o yaml || true",
              "ls -la /home/ubuntu || true",
              "sed -n 1,160p /home/ubuntu/deploy-openchoreo.sh || true",
              "curl -s ifconfig.me || true",
              "ss -lntp || true",
              "echo DONE"
            ]
          }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Open firewall + inspect OpenChoreo for $DOMAIN" \
            --timeout-seconds 300 \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

  build-frontend:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # EKS pulls application images from ECR (see infra/eks/terraform/ecr.tf).
      - name: Configure AWS credentials (EKS)
        if: vars.EKS_CLUSTER_NAME != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.EKS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR (EKS)
        if: vars.EKS_CLUSTER_NAME != ''
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/snapstock-backend-http
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
          tags: |
            ghcr.io/snapstock-ai/snapstock-client:dev-${{ github.sha }}
            ${{ steps.ecr.outputs.registry && format('{0}/snapstock-client:dev-{1}', steps.ecr.outputs.registry, github.sha) || '' }}

  deploy-frontend:
    # Legacy single-server (K3s/OpenChoreo) deploy over SSM. Off by default since the app moved to EKS;
    # set the repo variable K3S_DEPLOY_ENABLED=true (and a valid AWS_ROLE_ARN) to use it again.
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy')) && vars.K3S_DEPLOY_ENABLED == 'true'
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy frontend through SSM
        env:
          INSTANCE_ID: ${{ vars.SNAPSTOCK_SERVER_INSTANCE_ID }}
          IMAGE: ghcr.io/snapstock-ai/snapstock-client:dev-${{ github.sha }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy SnapStock Frontend" \
            --parameters commands="runuser -u ubuntu -- /home/ubuntu/deploy-openchoreo.sh frontend $IMAGE" \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

  deploy-frontend-eks:
    # Runs only after the EKS stack exists: set repo variables EKS_CLUSTER_NAME and EKS_DEPLOY_ROLE_ARN.
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy')) && vars.EKS_CLUSTER_NAME != ''
    needs: build-frontend
    runs-on: ubuntu-latest
    # App releases are owned by CI: only the image tag changes; infrastructure stays with Terraform.
    # One release at a time across the backend, frontend and AI pipelines (Helm locks the release).
    concurrency:
      group: snapstock-eks-release
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.EKS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Roll out frontend on EKS
        run: |
          aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"
          helm upgrade snapstock deploy/helm/snapstock \
            --namespace snapstock \
            --reset-then-reuse-values \
            --set frontend.image.tag=dev-${{ github.sha }} \
            --atomic --timeout 25m
          kubectl -n snapstock get pods -o wide
