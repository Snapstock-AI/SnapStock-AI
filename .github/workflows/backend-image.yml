name: Build and Deploy Backend

on:
  push:
    branches:
      - dev
    paths:
      - "server/**"
      - ".github/workflows/backend-image.yml"

  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        required: true
        type: choice
        options:
          - deploy
          - ensure-must-change-password
        default: deploy

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  ensure-must-change-password:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'ensure-must-change-password'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Apply schema fix via SSM
        env:
          INSTANCE_ID: ${{ vars.SNAPSTOCK_SERVER_INSTANCE_ID }}
        run: |
          set -euo pipefail

          python3 - <<'PY' > /tmp/ssm-params.json
          import json, base64, textwrap

          remote = textwrap.dedent(r'''
          set -eux
          export KUBECONFIG=/home/ubuntu/.kube/config
          NS=dp-default-snapstock-development-9f3d29f9
          POD=$(kubectl -n "$NS" get pods --field-selector=status.phase=Running -o name | grep backend | head -1 | cut -d/ -f2)
          echo "POD=$POD"
          test -n "$POD"
          cat > /tmp/ensure-mcp.js <<'JSEOF'
          const { Client } = require("pg");
          (async () => {
            const c = new Client({ connectionString: process.env.DATABASE_URL });
            await c.connect();
            await c.query("CREATE TABLE IF NOT EXISTS migrations (id SERIAL PRIMARY KEY, filename VARCHAR(255) UNIQUE NOT NULL, executed_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP)");
            await c.query("ALTER TABLE users ADD COLUMN IF NOT EXISTS must_change_password BOOLEAN NOT NULL DEFAULT FALSE");
            await c.query("INSERT INTO migrations (filename) SELECT $1 WHERE NOT EXISTS (SELECT 1 FROM migrations WHERE filename = $1)", ["019_add_temporary_password_flag.ts"]);
            const r = await c.query("SELECT column_name FROM information_schema.columns WHERE table_name = $1 AND column_name = $2", ["users", "must_change_password"]);
            console.log(r.rows.length ? "column-ok" : "column-missing");
            await c.end();
          })().catch((e) => { console.error(e); process.exit(1); });
          JSEOF
          kubectl -n "$NS" cp /tmp/ensure-mcp.js "$POD":/tmp/ensure-mcp.js
          kubectl -n "$NS" exec "$POD" -- node /tmp/ensure-mcp.js
          ''').strip() + "\n"

          b64 = base64.b64encode(remote.encode()).decode()
          print(json.dumps({
            "commands": [
              f"echo {b64} | base64 -d > /tmp/ensure-mcp.sh",
              "bash /tmp/ensure-mcp.sh",
            ]
          }))
          PY

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Ensure users.must_change_password exists" \
            --timeout-seconds 300 \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output json

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          test "$STATUS" = "Success"

  build-backend:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/snapstock-ai/snapstock-server:dev-${{ github.sha }}

  deploy-backend:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy')
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy backend through SSM
        env:
          INSTANCE_ID: ${{ vars.SNAPSTOCK_SERVER_INSTANCE_ID }}
          IMAGE: ghcr.io/snapstock-ai/snapstock-server:dev-${{ github.sha }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy SnapStock Backend" \
            --parameters commands="runuser -u ubuntu -- /home/ubuntu/deploy-openchoreo.sh backend $IMAGE" \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"
