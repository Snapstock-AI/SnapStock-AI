name: Build and Deploy Backend

on:
  push:
    branches:
      - dev
    paths:
      - "server/**"
      - ".github/workflows/backend-image.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write


jobs:

  build-backend:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/snapstock-ai/snapstock-server:dev-${{ github.sha }}



  deploy-backend:

    needs: build-backend

    runs-on: ubuntu-latest


    steps:


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}



      - name: Deploy backend through SSM
        env:
          INSTANCE_ID: ${{ vars.SNAPSTOCK_SERVER_INSTANCE_ID }}
          IMAGE: ghcr.io/snapstock-ai/snapstock-server:dev-${{ github.sha }}

        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy SnapStock Backend" \
            --parameters commands="runuser -u ubuntu -- /home/ubuntu/deploy-openchoreo.sh backend $IMAGE" \
            --query "Command.CommandId" \
            --output text)


          echo "Command ID: $COMMAND_ID"


          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"


          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"