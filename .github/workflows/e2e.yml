name: E2E and accessibility

# Slower than unit tests, so it runs nightly/on demand and only on dev pushes that change E2E files.
on:
  push:
    branches:
      - dev
    paths:
      - "e2e/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/snapstock_test
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            server/package-lock.json
            client/package-lock.json
      - name: Install E2E dependencies
        run: npm ci
        working-directory: e2e
      - name: Install backend dependencies
        run: npm ci
        working-directory: server
      - name: Install frontend dependencies
        run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Run browser, degraded-mode and accessibility tests
        run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports
          path: e2e/reports
          if-no-files-found: ignore
